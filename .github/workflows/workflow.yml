name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    permissions:
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - 5

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only

      - run: opam exec -- make compiler jscompiler lsp vultweb vultlib

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            _build/default/src/vult.exe
            vult-lsp

      - name: Save vult.js artifact
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vult.js
          path: vult.js

      - name: Save vultweb.js artifact
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vultweb.js
          path: vultweb.js

      - name: Save vultlib.js artifact
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vultlib.js
          path: vultlib.js

      - name: Save vult-lsp.js artifact
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vult-lsp.js
          path: vult-lsp.js

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.ocaml-compiler }}-vult.exe
          path: _build/default/src/vult.exe

      - name: Upload the LSP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.ocaml-compiler }}-vult-lsp
          path: vult-lsp

  pre-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          cp artifacts/vult.js/vult.js release/
          cp artifacts/vultweb.js/vultweb.js release/
          cp artifacts/vultlib.js/vultlib.js release/
          cp artifacts/vult-lsp.js/vult-lsp.js release/

          cp artifacts/ubuntu-latest-5-vult.exe/vult.exe vult
          cp artifacts/ubuntu-latest-5-vult-lsp/vult-lsp vult-lsp
          zip release/vult-linux.zip vult vult-lsp
          rm vult vult-lsp

          cp artifacts/macos-latest-5-vult.exe/vult.exe vult
          cp artifacts/macos-latest-5-vult-lsp/vult-lsp vult-lsp
          zip release/vult-macos.zip vult vult-lsp
          rm vult vult-lsp

          cp artifacts/windows-latest-5-vult.exe/vult.exe vult.exe
          cp artifacts/windows-latest-5-vult-lsp/vult-lsp vult-lsp.exe
          zip release/vult-windows.zip vult.exe vult-lsp.exe
          rm vult.exe vult-lsp.exe

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1-latest
          name: "v1 Pre-release"
          body: |
            Automated pre-release from the `v1` branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            This is a development build and may be unstable.
          prerelease: true
          make_latest: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
