name = "Vult"
path_suffixes = ["vult"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
autoclose_before = ";,=)}]"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
tab_size = 3
